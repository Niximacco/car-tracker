# Builds a container, pushes it to Google Artifact Registry, and deploys it to
# Cloud Run when a commit lands on main.
#
# There is deliberately nothing to deploy but the container. The service renders
# its own pages from templates compiled into the binary, the stylesheet is
# embedded the same way and served under a hashed name, and even the four years
# of spreadsheet history the first import offers is a pair of csv files inside
# the binary - so a static asset is cached forever without there being a second
# place to deploy to and keep in step. Same shape as wild-games, flight-log and
# niximacco-recipes. The running service talks to datastore, to auth.ajn.me, and
# to nothing further.
#
# To configure this workflow:
#
# 1. Enable the APIs:
#      Cloud Run          run.googleapis.com
#      Artifact Registry  artifactregistry.googleapis.com
#      Datastore          datastore.googleapis.com
#
# 2. Create the Artifact Registry repository named by SERVICE below, in
#    GAR_LOCATION.
#
# 3. Add two repository secrets (these are identifiers, not credentials):
#      WIF_PROVIDER         the full workloadIdentityPools/.../providers/... name
#      WIF_SERVICE_ACCOUNT  the deploy service account email
#    and bind this repo to that service account with roles/iam.workloadIdentityUser
#    on the principalSet for attribute.repository/<owner>/<repo>. The deploy
#    account needs roles/run.admin (or run.developer), roles/artifactregistry.writer,
#    and roles/iam.serviceAccountUser on the runtime service account. See the
#    README for the exact commands.
#
# 4. The Cloud Run service's own runtime service account needs
#    roles/datastore.user, and access to the secrets listed in the README.

name: Build and Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: ajnhosting-163818
  GAR_LOCATION: us-central1
  SERVICE: car-tracker
  REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The tests cover the parts that are painful to debug in production: the
      # whole summary block checked against the numbers the spreadsheet has been
      # showing for four years, the rule that decides which tanks carry an mpg,
      # the spreadsheet reader, the route set gin builds at startup, and every
      # template rendering - a template only fails when it is asked to render.
      - name: Test
        run: go test ./...

  deploy:
    needs: test

    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless auth via Workload Identity Federation: GitHub mints a short-lived
      # OIDC token, Google exchanges it for a token on the deploy service
      # account. There is no long-lived JSON key to store or rotate. The
      # id-token: write permission above is what lets this job mint that token.
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: '${{ env.PROJECT_ID }}'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
          # Needed so the Docker login below has a token to authenticate with.
          token_format: 'access_token'

      # With no JSON key, Docker signs in with the short-lived access token the
      # auth step just produced rather than a _json_key password.
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v3'
        with:
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: Build and Push Container
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
