# Builds a container, pushes it to Google Artifact Registry, and deploys it to
# the pillar-of-autumn host when a commit lands on main.
#
# There is deliberately nothing to deploy but the container. The service renders
# its own pages from templates compiled into the binary, the stylesheet is
# embedded the same way and served under a hashed name, and even the four years
# of spreadsheet history the first import offers is a pair of csv files inside
# the binary - so a static asset is cached forever without there being a second
# place to deploy to and keep in step. Same shape as wild-games, flight-log and
# niximacco-recipes. The running service talks to datastore, to auth.ajn.me, and
# to nothing further.
#
# To configure this workflow:
#
# 1. The Artifact Registry repository named by SERVICE below, in GAR_LOCATION.
#
# 2. Two repository secrets (these are identifiers, not credentials):
#      WIF_PROVIDER         the full workloadIdentityPools/.../providers/... name
#      WIF_SERVICE_ACCOUNT  the deploy service account email
#    with this repository bound to that account by roles/iam.workloadIdentityUser
#    on the principalSet for attribute.repository/<owner>/<repo>. The account
#    needs roles/artifactregistry.writer to push, and has to be one of the
#    DEPLOYERS the host accepts in order to deploy.
#
# 3. Everything about how the service runs - its environment, its secrets, the
#    domains in front of it, its memory limit and the permissions it runs with -
#    is in Niximacco/pillar-of-autumn (host/compose.yaml, host/secrets.json,
#    host/Caddyfile and terraform/), under the name in SERVICE below.

name: Build and Deploy

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: ajnhosting-163818
  GAR_LOCATION: us-central1
  SERVICE: car-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The tests cover the parts that are painful to debug in production: the
      # whole summary block checked against the numbers the spreadsheet has been
      # showing for four years, the rule that decides which tanks carry an mpg,
      # the spreadsheet reader, the route set gin builds at startup, and every
      # template rendering - a template only fails when it is asked to render.
      - name: Test
        run: go test ./...

  deploy:
    needs: test

    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless auth via Workload Identity Federation: GitHub mints a short-lived
      # OIDC token, Google exchanges it for a token on the deploy service
      # account. There is no long-lived JSON key to store or rotate. The
      # id-token: write permission above is what lets this job mint that token.
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: '${{ env.PROJECT_ID }}'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
          # Needed so the Docker login below has a token to authenticate with.
          token_format: 'access_token'

      # With no JSON key, Docker signs in with the short-lived access token the
      # auth step just produced rather than a _json_key password.
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v3'
        with:
          username: oauth2accesstoken
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: Build and Push Container
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # An identity token for ops.ajn.me, minted as the same deploy account that
      # just pushed the image. The host accepts it only from that account and
      # only for that audience, and it expires within the hour - so there is no
      # deploy secret to keep in this repository.
      - name: Deploy Token
        id: deploy-token
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
          token_format: 'id_token'
          id_token_audience: 'https://ops.ajn.me'
          id_token_include_email: true

      # The host pulls this build, recreates the container on it and waits for
      # it to report healthy. If it does not, the previous build goes back and
      # this step fails - a broken build is a red check on the commit that broke
      # it, with the site still up on the one before.
      - name: Deploy to pillar-of-autumn
        run: |-
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST https://ops.ajn.me/api/deploy \
            -H "Authorization: Bearer ${{ steps.deploy-token.outputs.id_token }}" \
            -H "Content-Type: application/json" \
            -d '{"service": "${{ env.SERVICE }}", "tag": "${{ github.sha }}"}'
